# Shared NATS server config template for a 3-node JetStream cluster.
# Each node's compose service overrides server_name and mounts this same
# file; cluster routes reference the other two nodes by their compose
# service DNS names so this file doesn't need to differ per node.

# HTTP monitoring endpoint (http://<node>:8222/varz, /jsz, etc.)
http_port: 8222

jetstream {
  store_dir: /data/jetstream
  # Home-lab sizing — bump these if you outgrow them.
  max_mem_store: 256MB
  max_file_store: 4GB
}

cluster {
  name: agent-hive
  listen: 0.0.0.0:6222

  routes: [
    nats-route://nats-1:6222
    nats-route://nats-2:6222
    nats-route://nats-3:6222
  ]
}

# Client connections
listen: 0.0.0.0:4222
